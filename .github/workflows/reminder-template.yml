name: Meal Registration Reminder

on:
  schedule:
    # 07:45 sáng (UTC 00:45) - 15 phút trước giờ chốt bữa trưa 08:00
    - cron: '45 0 * * 1-6'
    # 13:45 chiều (UTC 06:45) - 15 phút trước giờ chốt bữa chiều 14:00
    - cron: '45 6 * * 1-6'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Gửi nhắc nhở
        run: |
          echo "Kiểm tra và nhắc nhở thành viên chưa đăng ký cơm trước giờ chốt..."
